<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001d65"/>
      <stop offset="0.6" stop-color="#00154e"/>
      <stop offset="1" stop-color="#000f3a"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0055f5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0055f5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#fbg)"/>
  <rect width="1024" height="500" fill="url(#fglow)"/>

  <!-- wordmark -->
  <text x="70" y="130" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-2">WorkMart</text>
  <text x="72" y="185" font-size="30" fill="#c3d4ff">Trusted local services, paid safely through escrow.</text>

  <!-- offer pill -->
  <rect x="70" y="225" width="470" height="56" rx="28" fill="#f5741b" fill-opacity="0.18" stroke="#f5741b" stroke-width="2"/>
  <text x="305" y="262" text-anchor="middle" font-size="25" font-weight="800" fill="#ffd9b8" letter-spacing="1.5">ZERO PLATFORM FEE · LIMITED PERIOD</text>

  <!-- mini proof row -->
  <g font-size="22" fill="#dfe8ff" font-weight="700">
    <text x="72" y="340">🔒 Escrow</text>
    <text x="240" y="340">🪪 KYC-verified</text>
    <text x="470" y="340">💝 Tips 100% to workers</text>
  </g>

  <!-- shield device -->
  <g transform="translate(830,250)">
    <rect x="-110" y="-150" width="220" height="300" rx="44" fill="#0b132b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="-94" y="-134" width="188" height="268" rx="32" fill="#f4f7fd"/>
    <path d="M0,-80 L62,-56 V-2 C62,32 32,58 0,72 C-32,58 -62,32 -62,-2 V-56 Z" fill="#085ceb"/>
    <path d="M-24,-2 L-8,14 L28,-16" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-60" y="92" width="120" height="26" rx="13" fill="#085ceb"/>
    <text x="0" y="111" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">₹500 secured</text>
  </g>
</svg>
