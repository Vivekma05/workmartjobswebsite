<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001d65"/>
      <stop offset="0.55" stop-color="#00154e"/>
      <stop offset="1" stop-color="#000f3a"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.8" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#0055f5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0055f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#f5741b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5741b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0055f5"/>
      <stop offset="1" stop-color="#003cd4"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glowB)"/>
  <rect width="1080" height="1350" fill="url(#glowO)"/>

  <!-- offer pill -->
  <g>
    <rect x="240" y="88" width="600" height="64" rx="32" fill="#f5741b" fill-opacity="0.18" stroke="#f5741b" stroke-width="2"/>
    <text x="540" y="130" text-anchor="middle" font-size="30" font-weight="800" fill="#ffd9b8" letter-spacing="2">LAUNCH OFFER · ZERO PLATFORM FEE</text>
  </g>

  <!-- headline -->
  <text x="90" y="320" font-size="104" font-weight="900" fill="#ffffff" letter-spacing="-2">Kaam pakka.</text>
  <text x="90" y="436" font-size="104" font-weight="900" fill="#ffffff" letter-spacing="-2">Payment pakka.</text>
  <rect x="92" y="470" width="150" height="10" rx="5" fill="#f5741b"/>

  <text x="90" y="560" font-size="34" fill="#c3d4ff">Book trusted cleaners, painters &amp; movers near you.</text>
  <text x="90" y="608" font-size="34" fill="#c3d4ff">Money stays in secure escrow till the work is done.</text>

  <!-- shield emblem -->
  <g transform="translate(540,830)">
    <circle r="150" fill="#ffffff" fill-opacity="0.06"/>
    <circle r="150" fill="none" stroke="#4c8df5" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M0,-95 L82,-62 V10 C82,62 44,98 0,118 C-44,98 -82,62 -82,10 V-62 Z" fill="#085ceb"/>
    <path d="M-32,8 L-8,32 L36,-22" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- proof rows -->
  <g font-size="30" fill="#dfe8ff" font-weight="700">
    <text x="200" y="1062">🔒  Escrow on every job</text>
    <text x="200" y="1116">🪪  KYC-verified workers</text>
    <text x="200" y="1170">💝  Tips go 100% to workers</text>
  </g>

  <!-- CTA -->
  <rect x="90" y="1210" width="900" height="92" rx="16" fill="url(#btn)"/>
  <text x="540" y="1268" text-anchor="middle" font-size="36" font-weight="800" fill="#ffffff">Email JOIN to workmartjobs@gmail.com</text>
</svg>
